<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retomada · Agosto 2026 — cobrasq.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Inter+Tight:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A1530; --graphite:#15224A; --accent:#C9A961; --accent-2:#9C7F40;
    --paper:#EFEAD9; --paper-2:#E2DBC6;
    --line-paper-14:rgba(10,21,48,.14); --line-paper-10:rgba(10,21,48,.10);
    --line-paper-08:rgba(10,21,48,.08); --line-paper-06:rgba(10,21,48,.06);
    --line-ink-16:rgba(239,234,217,.16); --line-ink-28:rgba(239,234,217,.28); --line-ink-30:rgba(239,234,217,.3);
    --sub-on-paper:#5C6270; --sub-on-doc:#4A5069; --label-on-paper:#40465E;
    --done-on-paper:rgba(10,21,48,.4); --done-on-ink:rgba(239,234,217,.4);
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --serif:'Fraunces', serif;
    --script:'Instrument Serif', serif;
    --sans:'Inter Tight', -apple-system, system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{background:var(--paper-2); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased;}
  a{color:var(--accent-2); text-decoration:none;}
  a:hover{color:var(--ink);}
  button, input{font-family:inherit;}
  button{border-radius:0;}

  /* ---- topbar ---- */
  .topbar{position:sticky; top:0; z-index:20; background:rgba(226,219,198,.92); backdrop-filter:blur(14px); border-bottom:1px solid var(--line-paper-14);}
  .topbar-inner{max-width:1120px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; gap:20px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:14px; flex:1; min-width:250px;}
  .brand-dot{width:9px; height:9px; border-radius:50%; background:var(--accent); flex:none;}
  .wordmark{font-family:var(--serif); font-weight:300; font-size:1.45rem; letter-spacing:.02em; line-height:1;}
  .wordmark .dot{color:var(--accent);}
  .brand-div{width:1px; height:26px; background:rgba(10,21,48,.2); flex:none;}
  .brand-label{font-family:var(--mono); font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--sub-on-doc);}
  .topbar-right{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .progress-wrap{display:flex; align-items:center; gap:10px;}
  .progress-track{width:120px; background:var(--line-paper-14); height:3px; overflow:hidden;}
  .progress-fill{background:var(--accent); height:100%; transition:width .3s;}
  .progress-counter{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--sub-on-doc); white-space:nowrap;}
  .btn-print{background:var(--ink); color:var(--paper); border:1px solid var(--accent); padding:8px 15px; font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; cursor:pointer; white-space:nowrap;}
  .btn-print:hover{background:var(--graphite);}

  /* ---- shell ---- */
  .shell{max-width:1120px; margin:0 auto; padding:26px 24px 90px; display:grid; grid-template-columns:minmax(0,1fr) 304px; gap:26px; align-items:start;}
  main{display:flex; flex-direction:column; gap:20px; min-width:0;}
  aside{position:sticky; top:92px; display:flex; flex-direction:column; gap:18px;}
  @media (max-width:900px){
    .shell{grid-template-columns:1fr;}
    aside{position:static;}
  }

  /* ---- day panel (marinho) ---- */
  .day-panel{background:var(--ink); color:var(--paper); padding:26px 28px; border-top:1px solid var(--accent);}
  .day-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:14px;}
  .day-head-left{display:flex; align-items:baseline; gap:14px;}
  .day-tag{font-family:var(--mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent);}
  .day-date{font-family:var(--script); font-style:italic; font-size:1.6rem; line-height:1;}
  .day-head-right{display:flex; align-items:center; gap:12px;}
  .day-frac{font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:rgba(239,234,217,.55);}
  .day-nav{display:flex; gap:6px;}
  .day-nav button{background:none; border:1px solid var(--line-ink-30); color:var(--paper); width:26px; height:26px; cursor:pointer; font-size:.8rem; line-height:1;}
  .day-nav button:hover{border-color:var(--accent); color:var(--accent);}
  .day-strip{display:flex; gap:6px; overflow-x:auto; padding-bottom:12px; margin-bottom:2px;}
  .day-chip{flex:none; padding:5px 10px; font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; cursor:pointer; background:transparent; color:var(--paper); border:1px solid var(--line-ink-28);}
  .day-chip.on{background:var(--accent); color:var(--ink); border-color:var(--accent); opacity:1; text-decoration:none;}
  .day-chip.pend-off{opacity:.62; text-decoration:line-through;}
  .day-tasks{display:flex; flex-direction:column;}
  .task-row{display:flex; align-items:flex-start; gap:14px; padding:13px 0; border-top:1px solid var(--line-ink-16); cursor:pointer;}
  .task-row input{margin-top:3px; width:17px; height:17px; accent-color:var(--accent); flex:none; cursor:pointer;}
  .task-row .task-body{flex:1; min-width:0;}
  .task-kind{display:inline-block; font-family:var(--mono); font-size:9px; font-weight:500; letter-spacing:.18em; text-transform:uppercase; margin-right:10px; white-space:nowrap; vertical-align:2px; color:rgba(239,234,217,.62);}
  .task-kind.crit{color:var(--accent);}
  .task-text{font-size:.95rem; line-height:1.5; color:var(--paper);}
  .task-text.done{text-decoration:line-through; color:var(--done-on-ink);}

  /* ---- papel cards ---- */
  .card{background:var(--paper); border:1px solid var(--line-paper-14); padding:20px 24px 22px;}
  .card-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:16px;}
  .card-title{font-family:var(--serif); font-weight:400; font-size:1.5rem; margin:0; letter-spacing:-.02em;}
  .chip-row{display:flex; gap:8px;}
  .chip{background:transparent; color:var(--sub-on-paper); border:1px solid var(--line-paper-14); padding:6px 12px; font-family:var(--mono); font-size:9px; letter-spacing:.16em; text-transform:uppercase; cursor:pointer;}
  .chip.on{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .chip:hover:not(.on){border-color:var(--accent-2); color:var(--ink);}
  .backlog-controls{display:flex; align-items:center; gap:12px;}
  .backlog-count{font-family:var(--mono); font-size:10px; letter-spacing:.14em; color:var(--sub-on-paper);}

  .days-list{display:flex; flex-direction:column;}
  .empty-state{font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--sub-on-doc); padding:18px 0; border-top:1px solid var(--line-paper-10);}
  .day-row{display:flex; gap:16px; padding:6px 0; border-top:1px solid var(--line-paper-10);}
  .day-row.all-done{opacity:.5;}
  .day-col{width:100px; flex:none; padding-top:11px;}
  .day-num{font-family:var(--serif); font-weight:400; font-size:1.1rem; line-height:1; letter-spacing:-.01em;}
  .day-wd{font-family:var(--mono); font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:var(--sub-on-paper); margin-top:5px;}
  .day-row-tasks{flex:1; min-width:0; display:flex; flex-direction:column;}
  .day-task-row{display:flex; align-items:flex-start; gap:12px; padding:10px 0; border-bottom:1px solid var(--line-paper-08); cursor:pointer;}
  .day-task-row input{margin-top:3px; width:16px; height:16px; accent-color:var(--accent-2); flex:none; cursor:pointer;}
  .day-task-row .task-kind{color:var(--label-on-paper);}
  .day-task-row .task-kind.crit{color:var(--ink);}
  .day-task-row .task-text{font-size:.9rem; color:var(--ink);}
  .day-task-row .task-text.done{color:var(--done-on-paper);}

  /* ---- backlog ---- */
  .client-group{border-bottom:1px solid var(--line-paper-08);}
  .client-head{display:flex; align-items:center; gap:12px; padding:12px 2px; cursor:pointer;}
  .caret{font-size:9px; color:var(--accent-2); transition:transform .2s; flex:none;}
  .caret.closed{transform:rotate(-90deg);}
  .client-name{font-family:var(--serif); font-weight:400; font-size:1.02rem; letter-spacing:-.01em; flex:1; min-width:0;}
  .overdue-badge{font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink); background:rgba(201,169,97,.3); border:1px solid var(--accent); padding:3px 8px; white-space:nowrap;}
  .client-frac{font-family:var(--mono); font-size:10px; color:var(--sub-on-paper); min-width:46px; text-align:right;}
  .client-items{padding:0 0 10px 28px;}
  .astrea-item{display:flex; align-items:flex-start; gap:11px; padding:8px 0; border-top:1px solid var(--line-paper-06); cursor:pointer;}
  .astrea-item input{margin-top:2px; width:15px; height:15px; accent-color:var(--accent-2); flex:none; cursor:pointer;}
  .astrea-item .task-body{flex:1; min-width:0;}
  .astrea-num{font-family:var(--mono); font-size:9px; letter-spacing:.1em; color:var(--sub-on-paper); margin-right:8px;}
  .astrea-body{font-size:.86rem; line-height:1.45; color:var(--ink);}
  .astrea-body.done{text-decoration:line-through; color:var(--done-on-paper);}
  .astrea-date{font-family:var(--mono); font-size:9px; letter-spacing:.1em; white-space:nowrap; margin-left:8px; padding:2px 7px; border:1px solid var(--line-paper-14); color:var(--sub-on-paper);}
  .astrea-date.over{background:rgba(201,169,97,.28); border-color:var(--accent); color:var(--ink);}

  /* ---- aside ---- */
  .aside-block{padding:18px 19px;}
  .aside-block.ink{background:var(--ink); color:var(--paper); border-top:1px solid var(--accent);}
  .aside-block.paper{background:var(--paper); border:1px solid var(--line-paper-14);}
  .aside-block.graphite{background:var(--graphite); color:var(--paper);}
  .aside-eyebrow{font-family:var(--mono); font-size:9px; letter-spacing:.2em; text-transform:uppercase; margin-bottom:14px;}
  .aside-eyebrow.on-ink{color:var(--accent);}
  .aside-eyebrow.on-paper{color:var(--label-on-paper);}
  .rotina-list{display:flex; flex-direction:column; gap:12px;}
  .rotina-when{font-family:var(--mono); font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:rgba(239,234,217,.6); margin-bottom:3px;}
  .rotina-what{font-size:.85rem; line-height:1.45; color:var(--paper);}
  .audiencias-list{display:flex; flex-direction:column; gap:14px;}
  .audiencia-row{display:flex; gap:12px;}
  .audiencia-day{font-family:var(--mono); font-size:10px; letter-spacing:.1em; flex:none; padding:3px 8px; height:fit-content; border:1px solid var(--line-paper-14); color:var(--ink);}
  .audiencia-day.today{background:rgba(201,169,97,.3); border-color:var(--accent);}
  .audiencia-who{display:block; font-family:var(--serif); font-weight:400; font-size:.98rem; line-height:1.25;}
  .audiencia-where{display:block; font-size:.79rem; color:var(--sub-on-paper); margin-top:3px; line-height:1.4;}
  .fila-list{display:flex; flex-direction:column;}
  .fila-row{display:flex; align-items:baseline; gap:10px; padding:7px 0; border-bottom:1px solid var(--line-paper-06);}
  .fila-n{font-family:var(--mono); font-size:9px; color:var(--accent); width:14px; flex:none;}
  .fila-name{flex:1; min-width:0; font-size:.82rem; line-height:1.35;}
  .fila-casos{font-family:var(--mono); font-size:10px; color:var(--sub-on-paper); flex:none;}
  .alarmes-list{display:flex; flex-direction:column; gap:10px;}
  .alarme-item{font-size:.81rem; line-height:1.45; color:rgba(239,234,217,.86);}
  .footer-row{display:flex; justify-content:space-between; align-items:center; font-family:var(--mono); font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--sub-on-paper);}
  .btn-reset{background:none; border:1px solid var(--line-paper-14); color:var(--sub-on-paper); padding:6px 12px; font-family:var(--mono); font-size:9px; letter-spacing:.16em; text-transform:uppercase; cursor:pointer;}
  .btn-reset:hover{border-color:var(--accent-2); color:var(--ink);}

  /* ---- print ---- */
  #printArea{display:none;}
  @media print{
    body *{visibility:hidden !important;}
    #printArea, #printArea *{visibility:visible !important;}
    #printArea{display:block !important; position:absolute; left:0; top:0; width:100%; color:#0A1530;}
    .print-word{font-family:var(--serif); font-weight:300; font-size:22px;}
    .print-head{font-family:var(--mono); font-size:9px; letter-spacing:.18em; text-transform:uppercase; margin-top:4px;}
    .print-meta{font-family:var(--mono); font-size:8px; letter-spacing:.16em; text-transform:uppercase; color:#666; margin-bottom:14px; padding-bottom:8px; border-bottom:1px solid #C9A961;}
    .print-row{display:flex; gap:8px; padding:6px 0; border-bottom:1px solid #e5e0d2; font-size:12px;}
    .print-box{width:14px; flex:none;}
    .print-kind{font-family:var(--mono); font-size:8px; letter-spacing:.16em; text-transform:uppercase; margin-right:8px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="wordmark">cobrasq<span class="dot">.</span></span>
      <span class="brand-div"></span>
      <span class="brand-label">Retomada · Agosto 2026</span>
    </div>
    <div class="topbar-right">
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <span class="progress-counter" id="progressCounter"></span>
      </div>
      <button class="btn-print" data-action="print-day">Imprimir o dia</button>

</div>

<div class="shell">

    <section class="day-panel" id="dayPanel"></section>
    <section class="card" id="upcomingCard"></section>
    <section class="card" id="backlogCard"></section>
  </main>
  <aside id="asideCol"></aside>
</div>

<div id="printArea"></div>

import { DATA } from './cronograma-data.js';

const KEY = 'cronograma-agosto-2026-agenda';

  ]],
  ['2026-08-24', 'seg', [

  ]],
  ['2026-08-25', 'ter', [

  ]],
  ['2026-08-26', 'qua', [
    ['WhatsApp', 'Triar: Elaine Baranoski, Mecânica Moreira, Marcielle Hauschilat, Dra. Ana'],

  ]],
  ['2026-08-27', 'qui', [
    ['Prazos', PRAZOS],
    ['Audiência', 'TRT9 — Edina Regina: confirmar data e preposto']
  ]],
  ['2026-08-28', 'sex', [

const ROTINA = [
  { when:'Quinta', what:'Cumprir os prazos pendentes da semana' },

];
const AUDIENCIAS = [
  { day:'05/08', who:'Elizangela de Ros × Ana Paula Krulikoski', where:'16h30 · JEC Palmas/PR — MS Teams, chave PAE82 JX9AW QZHB9 UWY2Q', hoje:true },
  { day:'17/08', who:'Juliana Skorek Bruch e Nilsa Celi Zeni', where:'Proc. 0006715-57' },
  { day:'20/08', who:'Jean Carlos Vialeto', where:'Proc. 0006255-36' },
  { day:'27/08', who:'Edina Regina', where:'TRT9 — confirmar data e preposto' }
];
const FILA = [
  { n:'1', name:'Odontomundi + 90 contratos novos', casos:'202' },
  { n:'2', name:'Leofer Metalúrgica e Outras', casos:'106' },
  { n:'3', name:'SOS Animal', casos:'93' },
  { n:'4', name:'COBRASQ casos próprios', casos:'57' },
  { n:'5', name:'Arte Estofados (LS + DV)', casos:'97' },
  { n:'6', name:'Saúde Farma · Vetclin · Injetcar', casos:'67' },

];
const ALARMES = [

];

const WD = { seg:'segunda', ter:'terça', qua:'quarta', qui:'quinta', sex:'sexta' };
const fmt = iso => Number(iso.slice(8)) + ' de ' + MES[iso.slice(5,7)];

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---- state ----
let checked = {}, astrea = {}, openClients = {}, scope = 'semana', onlyOverdue = false, sel = HOJE;
try { checked = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){}
try { astrea = JSON.parse(localStorage.getItem(LEGACY_KEY) || '{}'); } catch(e){}

function save(k, obj){ try { localStorage.setItem(k, JSON.stringify(obj)); } catch(e){} }

// ---- derive astrea backlog from cronograma-data.js (same parsing as the reference design) ----
function astreaItems(){
  const p = DATA.phases.find(x => x.id === 'fase8');
  const out = [];
  p.blocks.forEach(b => {
    if (b.t !== 'item') return;
    const segs = (b.segs || []).filter(g => !g.br);
    let client = '', body = '', dateRaw = '';
    segs.forEach((g, i) => {
      const t = (g.s || '').trim();
      if (i === 0 && g.b && !g.i && t.length < 70) { client = t; return; }
      const dm = t.match(/^\[(?:venc\.\s*)?(\d{2}\/\d{2}\/\d{4})/);
      if (g.i && dm) { dateRaw = dm[1]; return; }
      if (g.w || g.m) return;
      body += (body ? ' ' : '') + t;
    });
    body = body.replace(/^—\s*/, '').replace(/\s+—\s*$/, '');
    let days = null;
    if (dateRaw) {
      const [dd, mm, yy] = dateRaw.split('/').map(Number);
      days = Math.round((new Date(yy, mm - 1, dd) - new Date(2026, 7, 5)) / 86400000);
    }
    out.push({ id:b.id, num:b.num, client: client || 'Sem cliente vinculado', body, dateRaw, days });
  });
  return out;
}
const ASTREA_ITEMS = astreaItems();

// ---- render helpers ----
function taskRowHtml(dayId, tasks, dark, i0){
  return tasks.map((t, i) => {
    const id = dayId + '-' + i;
    const ck = !!checked[id];
    const crit = CRITICO.includes(t[0]);
    const kindCls = dark ? 'task-kind' : 'task-kind';
    const rowCls = dark ? 'task-row' : 'day-task-row';
    const textCls = dark ? 'task-text' : 'task-text';
    return `<label class="${rowCls}" data-toggle-task="${id}">
      <input type="checkbox" ${ck ? 'checked' : ''} data-toggle-task="${id}">
      <span class="task-body">
        <span class="task-kind${crit ? ' crit' : ''}">${esc(t[0])}</span>
        <span class="${textCls}${ck ? ' done' : ''}">${esc(t[1])}</span>
      </span>
    </label>`;
  }).join('');
}

function renderDayPanel(){
  const idx = PLANO.findIndex(d => d[0] === sel);
  const si = idx < 0 ? 0 : idx;
  const today = PLANO[si];
  const tomorrowIdx = PLANO.findIndex(d => d[0] === HOJE) + 1;
  const tomorrow = PLANO[tomorrowIdx];
  const selTag = today[0] === HOJE ? 'Hoje' : (tomorrow && today[0] === tomorrow[0] ? 'Amanhã' : 'Dia selecionado');
  const hojeTasks = today[2].map((t, i) => ({ t, id: today[0] + '-' + i, checked: !!checked[today[0] + '-' + i] }));
  const doneHoje = hojeTasks.filter(x => x.checked).length;

  const stripHtml = PLANO.map(d => {
    const on = d[0] === sel;
    const pend = d[2].some((t, i) => !checked[d[0] + '-' + i]);
    const label = d[0].slice(8) + ' ' + (d[0].slice(5,7) === '08' ? 'ago' : 'set') + ' · ' + d[1];
    const cls = ['day-chip', on ? 'on' : '', (!on && !pend) ? 'pend-off' : ''].filter(Boolean).join(' ');
    return `<button class="${cls}" data-pick-day="${d[0]}">${esc(label)}</button>`;
  }).join('');

  document.getElementById('dayPanel').innerHTML = `
    <div class="day-head">
      <div class="day-head-left">
        <span class="day-tag">${esc(selTag)}</span>
        <span class="day-date">${esc(WD[today[1]] || today[1])}, ${esc(fmt(today[0]))}</span>
      </div>
      <div class="day-head-right">
        <span class="day-frac">${doneHoje}/${hojeTasks.length} feitos</span>
        <div class="day-nav">
          <button data-action="prev-day" title="Dia anterior">‹</button>
          <button data-action="next-day" title="Próximo dia">›</button>
        </div>
      </div>
    </div>
    <div class="day-strip">${stripHtml}</div>
    <div class="day-tasks">${taskRowHtml(today[0], today[2], true)}</div>
  `;
}

function renderUpcoming(){
  const upcoming = PLANO.filter(d => d[0] > HOJE);
  const shown = scope === 'semana' ? upcoming.filter(d => d[0] <= '2026-08-09')
    : (scope === 'prox' ? upcoming.filter(d => d[0] >= '2026-08-10' && d[0] <= '2026-08-16')
    : upcoming);

  const scopesHtml = [['semana','Esta semana'], ['prox','Semana que vem'], ['mes','Até 01/09']].map(([k, label]) =>
    `<button class="chip${scope === k ? ' on' : ''}" data-pick-scope="${k}">${label}</button>`
  ).join('');

  const daysHtml = shown.length === 0
    ? `<div class="empty-state">Nenhum dia neste recorte</div>`
    : shown.map(d => {
        const tasks = d[2].map((t, i) => ({ t, checked: !!checked[d[0] + '-' + i] }));
        const allDone = tasks.every(t => t.checked);
        const dayLabel = d[0].slice(8) + ' ' + (d[0].slice(5,7) === '08' ? 'ago' : 'set');
        return `<div class="day-row${allDone ? ' all-done' : ''}">
          <div class="day-col">
            <div class="day-num">${esc(dayLabel)}</div>
            <div class="day-wd">${esc(d[1])}</div>
          </div>
          <div class="day-row-tasks">${taskRowHtml(d[0], d[2], false)}</div>
        </div>`;
      }).join('');

  document.getElementById('upcomingCard').innerHTML = `
    <div class="card-head">
      <h2 class="card-title">Os próximos dias</h2>
      <div class="chip-row">${scopesHtml}</div>
    </div>
    <div class="days-list">${daysHtml}</div>
  `;
}

function renderBacklog(){
  const visible = onlyOverdue ? ASTREA_ITEMS.filter(i => i.days !== null && i.days < 0) : ASTREA_ITEMS;
  const byClient = {};
  visible.forEach(i => { (byClient[i.client] = byClient[i.client] || []).push(i); });
  const clientNames = Object.keys(byClient).sort((a, b) => byClient[b].length - byClient[a].length);
  const astreaDone = ASTREA_ITEMS.filter(i => astrea[i.id]).length;

  const clientsHtml = clientNames.map(name => {
    const list = byClient[name];
    const open = !!openClients[name];
    const dn = list.filter(i => astrea[i.id]).length;
    const overdue = list.filter(i => i.days !== null && i.days < 0 && !astrea[i.id]).length;
    const overdueLabel = overdue ? (overdue === 1 ? '1 vencido' : overdue + ' vencidos') : '';
    const itemsHtml = list.map(i => {
      const ck = !!astrea[i.id];
      const over = i.days !== null && i.days < 0;
      const dateLabel = i.dateRaw ? (over ? i.dateRaw + ' · vencido há ' + Math.abs(i.days) + 'd' : i.dateRaw) : '';
      return `<label class="astrea-item" data-toggle-astrea="${i.id}">
        <input type="checkbox" ${ck ? 'checked' : ''} data-toggle-astrea="${i.id}">
        <span class="task-body">
          <span class="astrea-num">${esc(i.num)}</span>
          <span class="astrea-body${ck ? ' done' : ''}">${esc(i.body)}</span>
          ${dateLabel ? `<span class="astrea-date${over ? ' over' : ''}">${esc(dateLabel)}</span>` : ''}
        </span>
      </label>`;
    }).join('');
    return `<div class="client-group">
      <div class="client-head" data-toggle-client="${esc(name)}">
        <span class="caret${open ? '' : ' closed'}">▾</span>
        <span class="client-name">${esc(name)}</span>
        ${overdueLabel ? `<span class="overdue-badge">${overdueLabel}</span>` : ''}
        <span class="client-frac">${dn}/${list.length}</span>
      </div>
      ${open ? `<div class="client-items">${itemsHtml}</div>` : ''}
    </div>`;
  }).join('');

  document.getElementById('backlogCard').innerHTML = `
    <div class="card-head">
      <h2 class="card-title">Backlog do Astrea</h2>
      <div class="backlog-controls">
        <button class="chip${onlyOverdue ? ' on' : ''}" data-action="toggle-vencidos">Só vencidos</button>
        <span class="backlog-count">${astreaDone}/${ASTREA_ITEMS.length}</span>
      </div>
    </div>
    <div class="clients-list">${clientsHtml}</div>
  `;
}

function renderAside(){
  const rotinaHtml = ROTINA.map(r => `<div><div class="rotina-when">${esc(r.when)}</div><div class="rotina-what">${esc(r.what)}</div></div>`).join('');
  const audHtml = AUDIENCIAS.map(a => `<div class="audiencia-row">
    <span class="audiencia-day${a.hoje ? ' today' : ''}">${esc(a.day)}</span>
    <span class="task-body">
      <span class="audiencia-who">${esc(a.who)}</span>
      <span class="audiencia-where">${esc(a.where)}</span>
    </span>
  </div>`).join('');
  const filaHtml = FILA.map(f => `<div class="fila-row">
    <span class="fila-n">${esc(f.n)}</span>
    <span class="fila-name">${esc(f.name)}</span>
    <span class="fila-casos">${esc(f.casos)}</span>
  </div>`).join('');
  const alarmesHtml = ALARMES.map(a => `<div class="alarme-item">${esc(a.text)}</div>`).join('');

  document.getElementById('asideCol').innerHTML = `
    <div class="aside-block ink">
      <div class="aside-eyebrow on-ink">Ritmo fixo da semana</div>
      <div class="rotina-list">${rotinaHtml}</div>
    </div>
    <div class="aside-block paper">
      <div class="aside-eyebrow on-paper">Audiências de agosto</div>
      <div class="audiencias-list">${audHtml}</div>
    </div>
    <div class="aside-block paper">
      <div class="aside-eyebrow on-paper">Fila de migração</div>
      <div class="fila-list">${filaHtml}</div>
    </div>
    <div class="aside-block graphite">
      <div class="aside-eyebrow on-ink">Sai do roteiro se</div>
      <div class="alarmes-list">${alarmesHtml}</div>
    </div>
    <div class="footer-row">
      <span>cobrasq.com.br</span>
      <button class="btn-reset" data-action="reset">Resetar</button>
    </div>
  `;
}

function renderTopbar(){
  const allTasks = [];
  PLANO.forEach(d => d[2].forEach((t, i) => allTasks.push(d[0] + '-' + i)));
  const done = allTasks.filter(id => checked[id]).length;
  document.getElementById('progressFill').style.width = (allTasks.length ? done / allTasks.length * 100 : 0) + '%';
  document.getElementById('progressCounter').textContent = done + ' / ' + allTasks.length + ' do plano';
}

function render(){
  renderTopbar();
  renderDayPanel();
  renderUpcoming();
  renderBacklog();
  renderAside();
}

// ---- actions ----
function toggleTask(id){
  checked = { ...checked, [id]: !checked[id] };
  save(KEY, checked);
  render();
}
function toggleAstrea(id){
  astrea = { ...astrea, [id]: !astrea[id] };
  save(LEGACY_KEY, astrea);
  render();
}
function pickDay(iso){ sel = iso; render(); }
function stepDay(delta){
  const idx = PLANO.findIndex(d => d[0] === sel);
  const si = idx < 0 ? 0 : idx;
  const next = Math.max(0, Math.min(PLANO.length - 1, si + delta));
  sel = PLANO[next][0];
  render();
}
function pickScope(k){ scope = k; render(); }
function toggleVencidos(){ onlyOverdue = !onlyOverdue; render(); }
function toggleClient(name){ openClients = { ...openClients, [name]: !openClients[name] }; render(); }
function doReset(){
  if (confirm('Resetar o plano de 30 dias?')) {
    checked = {};
    localStorage.removeItem(KEY);
    render();
  }
}
function printDay(){
  const idx = PLANO.findIndex(d => d[0] === sel);
  const si = idx < 0 ? 0 : idx;
  const today = PLANO[si];
  const label = (WD[today[1]] || today[1]) + ', ' + today[0].slice(8) + '/' + today[0].slice(5,7) + '/2026';
  const rows = today[2].map((t, i) => ({ kind:t[0], text:t[1], checked: !!checked[today[0] + '-' + i] }));
  const rowsHtml = rows.map(r => `<div class="print-row">
    <span class="print-box">${r.checked ? '☑' : '☐'}</span>
    <span><span class="print-kind">${esc(r.kind)}</span>${esc(r.text)}</span>
  </div>`).join('');
  document.getElementById('printArea').innerHTML = `
    <div class="print-word">cobrasq.</div>
    <div class="print-head">Retomada · ${esc(label)}</div>
    <div class="print-meta">Gerado em ${esc(new Date().toLocaleString('pt-BR'))}</div>
    ${rowsHtml}
  `;
  setTimeout(() => window.print(), 120);
}

// ---- event delegation ----
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-action], [data-pick-day], [data-pick-scope], [data-toggle-client]');
  if (!btn) return;
  if (btn.dataset.action === 'prev-day') stepDay(-1);
  else if (btn.dataset.action === 'next-day') stepDay(1);
  else if (btn.dataset.action === 'toggle-vencidos') toggleVencidos();
  else if (btn.dataset.action === 'reset') doReset();
  else if (btn.dataset.action === 'print-day') printDay();
  else if (btn.dataset.pickDay) pickDay(btn.dataset.pickDay);
  else if (btn.dataset.pickScope) pickScope(btn.dataset.pickScope);
  else if (btn.dataset.toggleClient) toggleClient(btn.dataset.toggleClient);
});
document.addEventListener('change', e => {
  const input = e.target;
  if (input.dataset && input.dataset.toggleTask) toggleTask(input.dataset.toggleTask);
  else if (input.dataset && input.dataset.toggleAstrea) toggleAstrea(input.dataset.toggleAstrea);
});
// checkbox click bubbles to label click too; guard against double toggle by only reacting on the input's change event,
// and preventing the wrapping label's default double-fire via the input itself (browser handles label->input click natively).

render();
</script>
